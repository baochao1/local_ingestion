# Alembic configuration for the metadata governance platform.
# The real URL is injected at runtime via the METADATA_DB_URL environment
# variable (see migrations/env.py); this is only a placeholder.
[alembic]
script_location = migrations
prepend_sys_path = src
sqlalchemy.url = postgresql+psycopg2://local_ingestion:local_ingestion@localhost:5432/metadata

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
